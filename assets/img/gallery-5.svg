<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-labelledby="g5Title g5Desc">
  <title id="g5Title">Calibración y verificación</title>
  <desc id="g5Desc">Ilustración de un manómetro de calibración conectado a un verificador digital y un certificado con sello de conformidad.</desc>

  <defs>
    <linearGradient id="g5Bg" x1="0" y1="0" x2="640" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eef8f6"/>
      <stop offset="1" stop-color="#d5eae5"/>
    </linearGradient>
    <linearGradient id="g5Face" x1="140" y1="110" x2="310" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef6f4"/>
    </linearGradient>
    <linearGradient id="g5Device" x1="404" y1="116" x2="594" y2="294" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6f2ef"/>
    </linearGradient>
    <linearGradient id="g5Display" x1="422" y1="136" x2="576" y2="222" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0c2825"/>
      <stop offset="1" stop-color="#123f39"/>
    </linearGradient>
    <linearGradient id="g5Bezel" x1="110" y1="92" x2="334" y2="316" gradientUnits="userSpaceOnUse">
      <stop stop-color="#134e4a"/>
      <stop offset="1" stop-color="#0e2421"/>
    </linearGradient>
  </defs>

  <rect width="640" height="480" fill="url(#g5Bg)"/>
  <circle cx="540" cy="72" r="136" fill="#bfe3dc" opacity=".45"/>
  <circle cx="64" cy="438" r="96" fill="#c4e6df" opacity=".4"/>
  <circle cx="320" cy="240" r="236" fill="#ffffff" opacity=".3"/>

  <!-- Destellos -->
  <g stroke="#0f766e" stroke-width="3" stroke-linecap="round" opacity=".25">
    <path d="M366 84v16M358 92h16"/>
    <path d="M78 300v14M71 307h14"/>
  </g>

  <!-- Manguera de conexión -->
  <path d="M222 334v14c0 18 14 30 32 30h116c18 0 32-12 32-30v-54"
        fill="none" stroke="#0e2421" stroke-width="8" stroke-linecap="round" opacity=".8"/>
  <rect x="212" y="320" width="20" height="18" rx="5" fill="#7f9c96"/>
  <rect x="392" y="284" width="20" height="18" rx="5" fill="#7f9c96"/>

  <!-- Manómetro -->
  <g>
    <ellipse cx="228" cy="326" rx="112" ry="14" fill="#0e2421" opacity=".1"/>
    <circle cx="222" cy="204" r="118" fill="#0e2421" opacity=".1"/>
    <circle cx="222" cy="198" r="118" fill="url(#g5Bezel)"/>
    <circle cx="222" cy="198" r="104" fill="#0f766e"/>
    <circle cx="222" cy="198" r="96" fill="url(#g5Face)"/>

    <!-- Escala -->
    <g stroke="#0e2421" stroke-width="4" stroke-linecap="round">
      <line x1="222" y1="110" x2="222" y2="122" transform="rotate(-120 222 198)"/>
      <line x1="222" y1="110" x2="222" y2="122" transform="rotate(-96 222 198)"/>
      <line x1="222" y1="110" x2="222" y2="122" transform="rotate(-72 222 198)"/>
      <line x1="222" y1="110" x2="222" y2="122" transform="rotate(-48 222 198)"/>
      <line x1="222" y1="110" x2="222" y2="122" transform="rotate(-24 222 198)"/>
      <line x1="222" y1="106" x2="222" y2="124" transform="rotate(0 222 198)"/>
      <line x1="222" y1="110" x2="222" y2="122" transform="rotate(24 222 198)"/>
      <line x1="222" y1="110" x2="222" y2="122" transform="rotate(48 222 198)"/>
      <line x1="222" y1="110" x2="222" y2="122" transform="rotate(72 222 198)"/>
      <line x1="222" y1="110" x2="222" y2="122" transform="rotate(96 222 198)"/>
      <line x1="222" y1="110" x2="222" y2="122" transform="rotate(120 222 198)"/>
    </g>
    <path d="M150 266a96 96 0 0 1-8-64" fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round" opacity=".6"/>
    <path d="M300 260a96 96 0 0 0 4-62" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" opacity=".55"/>

    <!-- Aguja -->
    <g transform="rotate(38 222 198)">
      <line x1="222" y1="198" x2="222" y2="122" stroke="#e11d48" stroke-width="6" stroke-linecap="round"/>
      <circle cx="222" cy="122" r="4.5" fill="#e11d48"/>
    </g>
    <circle cx="222" cy="198" r="16" fill="#0e2421"/>
    <circle cx="222" cy="198" r="7" fill="#e11d48"/>
    <circle cx="218" cy="194" r="2.5" fill="#ffffff" opacity=".7"/>

    <text x="222" y="252" text-anchor="middle" fill="#5b6c69" font-size="13" letter-spacing="2"
          font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">bar</text>
    <text x="222" y="276" text-anchor="middle" fill="#0f766e" font-size="10" letter-spacing="2.5"
          font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">BIOAURORA</text>
  </g>

  <!-- Verificador digital -->
  <g>
    <rect x="404" y="116" width="190" height="178" rx="18" fill="url(#g5Device)" stroke="#c3dcd6" stroke-width="2"/>
    <rect x="422" y="136" width="154" height="86" rx="10" fill="url(#g5Display)"/>
    <text x="436" y="158" fill="#7dd3c7" font-size="9" letter-spacing="2"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">PRESIÓN</text>
    <text x="436" y="204" fill="#6ee7b7" font-size="38" font-weight="700"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">1.013</text>
    <text x="536" y="204" fill="#7dd3c7" font-size="12"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">bar</text>
    <rect x="436" y="212" width="126" height="4" rx="2" fill="#1b4a44"/>

    <circle cx="438" cy="252" r="13" fill="#e2eeeb" stroke="#c3dcd6" stroke-width="2"/>
    <path d="M438 245v9M433 250l5 4 5-4" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round"/>
    <circle cx="474" cy="252" r="13" fill="#e2eeeb" stroke="#c3dcd6" stroke-width="2"/>
    <path d="M474 259v-9M469 254l5-4 5 4" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round"/>
    <circle cx="524" cy="252" r="7" fill="#34d399"/>
    <text x="540" y="256" fill="#5b6c69" font-size="10" letter-spacing="1.5"
          font-family="system-ui, sans-serif">OK</text>

    <path d="M440 90v18a10 10 0 0 0 10 10h76a10 10 0 0 0 10-10V90" fill="none" stroke="#9fb8b2" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Certificado -->
  <g transform="rotate(-3 300 392)">
    <rect x="170" y="330" width="262" height="116" rx="10" fill="#ffffff" stroke="#cfe3de" stroke-width="2"/>
    <text x="192" y="358" fill="#0f766e" font-size="12" font-weight="700" letter-spacing="2.5"
          font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">CERTIFICADO</text>
    <text x="192" y="376" fill="#5b6c69" font-size="9" letter-spacing="1.5"
          font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">DE CALIBRACIÓN</text>
    <rect x="192" y="392" width="132" height="5" rx="2.5" fill="#dbeae7"/>
    <rect x="192" y="406" width="108" height="5" rx="2.5" fill="#dbeae7"/>
    <rect x="192" y="420" width="120" height="5" rx="2.5" fill="#dbeae7"/>
    <circle cx="384" cy="394" r="23" fill="#0f766e"/>
    <circle cx="384" cy="394" r="17" fill="none" stroke="#ffffff" stroke-width="2" opacity=".6"/>
    <path d="M375 395l6 6 12-14" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="384" y="430" text-anchor="middle" fill="#0f766e" font-size="8" letter-spacing="1.5"
          font-family="system-ui, sans-serif">CONFORME</text>
  </g>

  <!-- Gancho y detalles -->
  <rect x="210" y="76" width="24" height="10" rx="5" fill="#7f9c96"/>
  <circle cx="356" cy="340" r="4" fill="#9fb8b2"/>
  <circle cx="374" cy="332" r="3" fill="#9fb8b2"/>
</svg>
