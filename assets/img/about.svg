<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" role="img" aria-labelledby="aboutTitle aboutDesc">
  <title id="aboutTitle">Laboratorio biomédico</title>
  <desc id="aboutDesc">Ilustración de un laboratorio biomédico con un microscopio, tubos de ensayo, un monitor de signos vitales y material de laboratorio.</desc>

  <defs>
    <linearGradient id="aboutBg" x1="80" y1="40" x2="720" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eef8f6"/>
      <stop offset="1" stop-color="#d7ebe6"/>
    </linearGradient>
    <linearGradient id="aboutTable" x1="70" y1="468" x2="730" y2="488" gradientUnits="userSpaceOnUse">
      <stop stop-color="#118077"/>
      <stop offset="1" stop-color="#0b5d57"/>
    </linearGradient>
    <linearGradient id="aboutScreen" x1="124" y1="134" x2="326" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0c2825"/>
      <stop offset="1" stop-color="#123f39"/>
    </linearGradient>
    <linearGradient id="aboutLiquid" x1="0" y1="360" x2="0" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <clipPath id="aboutTubeClip">
      <rect x="518" y="352" width="24" height="82" rx="12"/>
    </clipPath>
  </defs>

  <rect width="800" height="640" fill="url(#aboutBg)"/>
  <circle cx="664" cy="118" r="146" fill="#bfe3dc" opacity=".5"/>
  <circle cx="98" cy="560" r="102" fill="#c4e6df" opacity=".5"/>
  <circle cx="420" cy="330" r="280" fill="#ffffff" opacity=".3"/>

  <!-- Monitor de pared -->
  <rect x="110" y="120" width="232" height="152" rx="16" fill="#0e2421"/>
  <rect x="124" y="134" width="204" height="124" rx="10" fill="url(#aboutScreen)"/>
  <g opacity=".85">
    <path d="M138 192h34l8-6 7 12 8-5h20l10 5 8-8 7 30 8-44 9 24 8-7h26l8 5 7-6 6 9 8-5h28"
          fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="138" y="166" fill="#6ee7b7" font-size="22" font-weight="700"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">72</text>
    <text x="176" y="164" fill="#7dd3c7" font-size="10"
          font-family="system-ui, sans-serif">bpm</text>
    <text x="262" y="164" fill="#93c5fd" font-size="13" font-weight="600"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">98%</text>
  </g>
  <rect x="208" y="272" width="36" height="12" rx="5" fill="#9fb8b2"/>

  <!-- Estantería con material -->
  <rect x="552" y="214" width="180" height="9" rx="4.5" fill="#b9d8d1"/>
  <path d="M572 223v10M712 223v10" stroke="#b9d8d1" stroke-width="6" stroke-linecap="round"/>
  <g>
    <rect x="574" y="158" width="34" height="56" rx="8" fill="#ffffff" opacity=".85"/>
    <rect x="574" y="182" width="34" height="32" rx="8" fill="#5eead4" opacity=".8"/>
    <rect x="584" y="148" width="14" height="14" rx="4" fill="#0f766e"/>
    <rect x="626" y="172" width="30" height="42" rx="7" fill="#ffffff" opacity=".85"/>
    <rect x="626" y="190" width="30" height="24" rx="7" fill="#93c5fd" opacity=".9"/>
    <rect x="634" y="162" width="14" height="12" rx="3" fill="#0f766e"/>
    <rect x="674" y="164" width="40" height="50" rx="8" fill="#ffffff" opacity=".9" stroke="#cfe3de"/>
    <path d="M686 176h16v8h8v16h-8v8h-16v-8h-8v-16h8z" fill="#0f766e" opacity=".85"/>
  </g>

  <!-- Molécula decorativa -->
  <g stroke="#0f766e" stroke-width="2" opacity=".3" fill="#ffffff">
    <path d="M700 96l-26 18 8 32 34 8 22-24-8-28Z" fill="none"/>
    <circle cx="700" cy="96" r="7" fill="#0f766e" stroke="none"/>
    <circle cx="674" cy="114" r="6" fill="#5eead4" stroke="none"/>
    <circle cx="682" cy="146" r="6" fill="#0f766e" stroke="none"/>
    <circle cx="716" cy="154" r="5" fill="#93c5fd" stroke="none"/>
    <circle cx="738" cy="130" r="7" fill="#0f766e" stroke="none"/>
    <circle cx="730" cy="102" r="5" fill="#5eead4" stroke="none"/>
  </g>

  <!-- Flechas / destellos -->
  <g stroke="#0f766e" stroke-width="3" stroke-linecap="round" opacity=".25">
    <path d="M394 108v16M386 116h16"/>
    <path d="M86 316v14M79 323h14"/>
  </g>

  <!-- Mesa de laboratorio -->
  <ellipse cx="400" cy="580" rx="330" ry="26" fill="#0e2421" opacity=".08"/>
  <rect x="70" y="468" width="660" height="20" rx="10" fill="url(#aboutTable)"/>
  <rect x="140" y="488" width="16" height="92" fill="#0b5d57" opacity=".85"/>
  <rect x="644" y="488" width="16" height="92" fill="#0b5d57" opacity=".85"/>

  <!-- Matraz -->
  <g>
    <path d="M116 408h18v26l22 34H94l22-34z" fill="#ffffff" opacity=".8" stroke="#9ec9c2" stroke-width="2"/>
    <path d="M108 452h34l12 16H96z" fill="#5eead4" opacity=".85"/>
    <rect x="112" y="398" width="26" height="12" rx="5" fill="#cfe3de"/>
    <path d="M122 414v20" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round" opacity=".4"/>
  </g>

  <!-- Microscopio -->
  <g>
    <ellipse cx="326" cy="470" rx="96" ry="10" fill="#0e2421" opacity=".1"/>
    <path d="M286 440v-98c0-34 26-62 60-62h20" fill="none" stroke="#0f766e" stroke-width="28" stroke-linecap="round"/>
    <path d="M286 440v-98c0-34 26-62 60-62h20" fill="none" stroke="#14a095" stroke-width="10" stroke-linecap="round" opacity=".35"/>
    <rect x="250" y="436" width="152" height="32" rx="16" fill="#0b5d57"/>
    <rect x="268" y="442" width="116" height="8" rx="4" fill="#2dd4bf" opacity=".45"/>

    <!-- Cabezal y ocular -->
    <rect x="346" y="268" width="94" height="38" rx="13" fill="#0b5d57"/>
    <rect x="404" y="232" width="26" height="46" rx="10" fill="#134e4a"/>
    <rect x="400" y="224" width="34" height="14" rx="7" fill="#0f766e"/>
    <circle cx="417" cy="236" r="6" fill="#5eead4" opacity=".7"/>

    <!-- Revólver y objetivos -->
    <circle cx="366" cy="318" r="31" fill="#0e2421"/>
    <circle cx="366" cy="318" r="21" fill="#134e4a"/>
    <rect x="344" y="334" width="16" height="24" rx="7" fill="#0f766e"/>
    <rect x="364" y="338" width="14" height="26" rx="6" fill="#14a095"/>
    <rect x="383" y="332" width="15" height="22" rx="7" fill="#0f766e"/>

    <!-- Platina y portaobjetos -->
    <rect x="298" y="360" width="134" height="13" rx="6.5" fill="#134e4a"/>
    <rect x="332" y="354" width="58" height="7" rx="3.5" fill="#a5f3fc"/>
    <rect x="300" y="382" width="122" height="10" rx="5" fill="#0f766e" opacity=".3"/>

    <!-- Mandos y luz -->
    <circle cx="304" cy="404" r="17" fill="#0d9488" stroke="#0b5d57" stroke-width="3"/>
    <circle cx="304" cy="404" r="6" fill="#0b5d57"/>
    <circle cx="336" cy="410" r="11" fill="#0d9488" stroke="#0b5d57" stroke-width="3"/>
    <circle cx="336" cy="410" r="4" fill="#0b5d57"/>
    <circle cx="366" cy="424" r="10" fill="#fbbf24"/>
    <circle cx="366" cy="424" r="18" fill="#fbbf24" opacity=".2"/>
  </g>

  <!-- Gradilla con tubos -->
  <g>
    <rect x="506" y="352" width="24" height="82" rx="12" fill="#ffffff" opacity=".75" stroke="#9ec9c2" stroke-width="2"/>
    <rect x="512" y="392" width="12" height="38" rx="6" fill="#2dd4bf" clip-path="url(#aboutTubeClip)"/>
    <rect x="542" y="340" width="24" height="94" rx="12" fill="#ffffff" opacity=".75" stroke="#9ec9c2" stroke-width="2"/>
    <rect x="548" y="384" width="12" height="46" rx="6" fill="#60a5fa"/>
    <rect x="578" y="356" width="24" height="78" rx="12" fill="#ffffff" opacity=".75" stroke="#9ec9c2" stroke-width="2"/>
    <rect x="584" y="396" width="12" height="34" rx="6" fill="#fbbf24"/>
    <rect x="614" y="348" width="24" height="86" rx="12" fill="#ffffff" opacity=".75" stroke="#9ec9c2" stroke-width="2"/>
    <rect x="620" y="386" width="12" height="44" rx="6" fill="#f472b6"/>

    <rect x="494" y="414" width="164" height="18" rx="9" fill="#0d9488"/>
    <rect x="500" y="428" width="152" height="40" rx="9" fill="#0f766e"/>
    <g fill="#0b3a34">
      <ellipse cx="518" cy="423" rx="14" ry="5"/>
      <ellipse cx="554" cy="423" rx="14" ry="5"/>
      <ellipse cx="590" cy="423" rx="14" ry="5"/>
      <ellipse cx="626" cy="423" rx="14" ry="5"/>
    </g>
  </g>

  <!-- Cápsulas y portaobjetos sobre la mesa -->
  <g>
    <ellipse cx="478" cy="458" rx="26" ry="8" fill="#cfe3de"/>
    <path d="M452 456l36-8 6 8-36 8z" fill="#a5f3fc" opacity=".8"/>
    <rect x="704" y="440" width="12" height="28" rx="6" fill="#f472b6" transform="rotate(18 710 454)"/>
    <rect x="720" y="434" width="12" height="28" rx="6" fill="#93c5fd" transform="rotate(34 726 448)"/>
  </g>
</svg>
